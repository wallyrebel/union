name: Content skip regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: PYTHONPATH=src python -m pytest -q
      - name: Check repeated announcements and a changed venue with the configured model
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          CHECK_LIVE_EVENT_REVIEW: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-6-luna' }}
        run: PYTHONPATH=src python -m pytest -q tests/test_recent_coverage.py -k live_event_review
